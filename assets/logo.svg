<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1e3a5f" />

  <!-- Graduation Cap -->
  <g transform="translate(100, 80)">
    <!-- Cap Top -->
    <polygon points="-50,-20 0,-40 50,-20 0,0" fill="#ffffff" />
    <!-- Cap Bottom -->
    <polygon points="-50,-20 -50,0 0,20 50,0 50,-20" fill="#2d5a8a" />
    <!-- Tassel -->
    <line x1="0" y1="-40" x2="0" y2="-55" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="-55" r="4" fill="#ffd700" />
  </g>

  <!-- Open Book -->
  <g transform="translate(100, 130)">
    <!-- Left Page -->
    <path d="M-45,15 Q-25,5 0,15 L0,35 Q-25,25 -45,35 Z" fill="#ffffff" />
    <!-- Right Page -->
    <path d="M45,15 Q25,5 0,15 L0,35 Q25,25 45,35 Z" fill="#e8f4fc" />
    <!-- Book Spine -->
    <line x1="0" y1="15" x2="0" y2="35" stroke="#1e3a5f" stroke-width="2" />
  </g>

  <!-- CampusHub Text -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">CampusHub</text>
</svg>
